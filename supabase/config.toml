# Stripe calls this endpoint directly with no Supabase user JWT — it
# authenticates via the Stripe-Signature header instead (verified inside the
# function itself), so JWT verification must be disabled for this function only.
[functions.stripe-webhook]
verify_jwt = false

# Ops-only endpoint invoked manually (not by the app) — authenticates via the
# x-backfill-secret header instead of a Supabase user JWT.
[functions.backfill-subscriptions]
verify_jwt = false

# Student self-signup with a class code: there is no session yet when this is
# called, so it cannot require a user JWT. It validates the class code, the
# class's join setting and its seat limit itself.
[functions.join-class]
verify_jwt = false

# Free teacher sign-up (new school, or joining one by invite link). There is
# no session yet when this is called, so it cannot require a user JWT.
[functions.teacher-signup]
verify_jwt = false
